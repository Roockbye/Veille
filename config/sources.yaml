# Catalogue initial des sources de veille.
# Ce fichier sert à initialiser la base au premier lancement (ou via `python -m veille sources-import`).
# Les sources sont ensuite modifiables depuis l'interface (page « Sources et méthodologie »).
#
# Toutes les URL marquées `actif: true` ont été vérifiées le 2026-10-29 (HTTP 200, flux analysable).
# Note : le CERT-FR a migré de www.cert.ssi.gouv.fr vers cert.cyber.gouv.fr (redirection 302 constatée le 2026-10-29).
# Sources aéronautiques (EASA, BoostAeroSpace), nginx et Sénat ajoutées et vérifiées le 2026-10-31 pour le profil AéroStar.
# Les sources inaccessibles en collecte automatique sont conservées avec `actif: false`, un statut
# explicite et une alternative documentée : rien n'est contourné.
#
# Champs :
#   id              identifiant stable (lettres, chiffres, tirets)
#   type            rss | cisa_kev | iso_opendata | feedly | manuel
#   categorie       technique | reglementaire | normative | technologique
#   nature          officielle | editeur | presse_specialisee | recherche | communautaire
#   confiance       elevee | moyenne | faible   (fiabilité attendue de la source, pas des articles)
#   frequence_minutes  intervalle minimal entre deux interrogations
#   filtre_mots_cles   si renseigné, seuls les éléments contenant au moins un mot-clé sont conservés
#   max_items       nombre maximal d'éléments lus par collecte (flux volumineux)
#   technologies    technologies concernées (flux éditeurs) : utilisé pour la pertinence

