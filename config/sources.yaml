    organisme: Feedly
    nature: communautaire
    confiance: moyenne
    langue: en
    frequence_minutes: 360
    max_items: 100
    justification: >-
      Source complémentaire facultative : agrège les flux suivis dans le compte Feedly de l'utilisateur.
      La fiabilité dépend des flux d'origine (indiqués pour chaque article).
    alternative: >-
      Nécessite un jeton d'accès API officiel (variable FEEDLY_ACCESS_TOKEN), disponible selon l'offre Feedly.
      Sans jeton : exporter ses abonnements en OPML depuis Feedly et les importer dans le catalogue
      (page Sources) ; l'application les collecte alors directement en RSS. Voir docs/FEEDLY.md.
    actif: false
