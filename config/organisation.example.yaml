demonstration: true
nom: "NumériSanté Services (organisation fictive de démonstration)"
secteur: services_tic_b2b
secteurs_secondaires: [sante]
roles: [responsable_traitement, sous_traitant_rgpd, hebergeur_donnees_sante, deployeur_systeme_ia, fournisseur_administration]
taille: moyenne
effectif: 140
chiffre_affaires_meur: 18
pays: France
maturite_cyber: definie
activites:
  - Infogérance et hébergement d'applications métiers pour des établissements de santé privés
  - Développement et maintenance d'un portail patient (application web)
  - Support utilisateurs et administration de postes de travail pour ses clients
donnees_traitees: [donnees_personnelles, donnees_sante, donnees_rh, donnees_clients]
# Conseil : choisir des mots-clés précis (nom de produit plutôt que nom d'éditeur) pour limiter les faux positifs.
