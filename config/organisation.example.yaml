contraintes_securite:
  - "Budget : PME à marges serrées ; toute mesure doit être chiffrée et justifiée par un gain (garder un client, baisser la prime d'assurance, obtenir une aide Cyber Boost). Enveloppe sécurité de 180 k€ sur 18 mois, hors aide Cyber Boost"
  - "Ressources : 4 personnes à l'IT, aucune dédiée à la cybersécurité ; le responsable IT est aussi référent sécurité (pas de RSSI)"
  - "Métier : licences CAO coûteuses liées à un serveur de licences sur site ; stations CAO puissantes, lourdes à remplacer"
  - "Infogérant sans astreinte : pas d'intervention réseau ni pare-feu hors heures ouvrées"
  - "Continuité visée : RTO 24 h et RPO 4 h pour le serveur du BE, RTO 4 h pour l'AD ; une journée d'arrêt du BE coûte environ 55 k€ plus les pénalités"
risques_connus:
  - "Réseau à plat (serveurs, postes, imprimantes et Wi-Fi invités sur le même réseau)"
  - "Pas de MFA sur site, comptes administrateurs partagés (dont celui de l'infogérant), mots de passe par défaut dans l'AD"
  - "Sauvegardes sur un NAS dans la même salle, jamais restaurées ; pas de PRA"
  - "Aucune supervision : journaux non centralisés ; inventaire non à jour, serveurs mis à jour « quand on a le temps »"
  - "Points uniques de défaillance : serveur de fichiers du BE, serveur de licences CAO, lien Internet unique, infogérant, responsable IT"
  - "Incident de mars 2026 : compte Microsoft 365 d'un ingénieur compromis par un faux lien de partage, utilisé deux jours pour envoyer du phishing aux clients"

