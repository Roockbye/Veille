contraintes_securite:
  - Disponibilité 24/7 exigée par les clients établissements de santé
  - Hébergement des données de santé en France
  - Équipe sécurité réduite (1 RSSI, 2 administrateurs formés)
risques_connus:
  - Rançongiciel via l'accès VPN exposé sur Internet
  - Compromission de comptes par hameçonnage (Microsoft 365)
  - Vulnérabilités de l'application web portail patient
exigences:
  - {id: rgpd, nom: RGPD, type: legale, statut: identifiee, commentaire: "DPO désigné"}
  - {id: hds, nom: Certification HDS, type: legale, statut: identifiee, commentaire: "Certification à renouveler"}
  - {id: iso27001, nom: ISO/IEC 27001, type: contractuelle, statut: identifiee, commentaire: "Exigée par deux clients ; référentiel HDS adossé à l'ISO 27001"}
  - {id: nis2, nom: NIS 2, type: legale, statut: a_confirmer, commentaire: "Qualification entité importante à confirmer"}
themes_veille: [ia_generative, ia_cybersecurite, soar, siem_edr_xdr, zero_trust_iam, cloud_conteneurs, post_quantique, devsecops_sbom, detection_remediation]
